<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hồ Sơ Cá Nhân | Vovinam</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8fafc;
            color: #0f172a;
            padding-bottom: 50px;
        }
        .profile-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 30px;
        }
        .profile-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .profile-card h3 {
            margin-top: 0;
            color: #1e293b;
            border-bottom: 2px solid #e2ebf4;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
            color: #475569;
        }
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            box-sizing: border-box;
            outline: none;
        }
        .form-group input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
        }
        .form-group input[readonly] {
            background-color: #f1f5f9;
            color: #94a3b8;
            cursor: not-allowed;
        }
        .btn-save {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.3s;
        }
        .btn-save:hover { background-color: #1d4ed8; }
        
        .avatar-preview {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #e2ebf4;
            margin-bottom: 15px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="profile-container">
        <a href="index.html" style="color: #2563eb; text-decoration: none; font-weight: bold;">← Quay lại Trang chủ</a>
        
        <!-- THẺ 1: THÔNG TIN CÁ NHÂN -->
        <div class="profile-card">
            <h3>Thông Tin Cá Nhân</h3>
            <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px;">
                <img id="anhDaiDienHienThi" src="" alt="Avatar" class="avatar-preview">
                <div style="flex: 1;">
                    <div class="form-group">
                        <label>Đường dẫn Ảnh đại diện (Link ảnh)</label>
                        <input type="url" id="linkAnhMoi" placeholder="Dán link ảnh mới vào đây...">
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Họ và tên</label>
                <input type="text" id="hoTenProfile" value="Phùng Lữ Ngọc Chung" readonly>
            </div>
            <div class="form-group">
                <label>Câu lạc bộ</label>
                <input type="text" id="clbProfile" readonly>
            </div>
            <div class="form-group">
                <label>Số điện thoại liên hệ</label>
                <input type="tel" id="sdtProfile" placeholder="Nhập số điện thoại...">
            </div>
            
            <button class="btn-save" onclick="capNhatThongTin()">💾 Cập Nhật Hồ Sơ</button>
        </div>

        <!-- THẺ 2: ĐỔI MẬT KHẨU -->
        <div class="profile-card">
            <h3>Đổi Mật Khẩu</h3>
            <div class="form-group">
                <label>Mật khẩu cũ</label>
                <input type="password" id="mkCu" placeholder="Nhập mật khẩu hiện tại..." required>
            </div>
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="mkMoi" placeholder="Nhập mật khẩu mới..." required>
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" id="mkXacNhan" placeholder="Nhập lại mật khẩu mới..." required>
            </div>
            
            <button class="btn-save" style="background-color: #e11d48;" onclick="xuLyDoiMatKhau()">🔑 Đổi Mật Khẩu</button>
        </div>
    </div>

    <script>
        // API kết nối với máy chủ Apps Script hiện tại của bạn
        const API_LINK = "https://script.google.com/macros/s/AKfycbzR2qq52Umui1UC0FeunIbkhuDNBde8tdOM4Q5AmKnXKWvLtcJeelNvcNfBRV5a1PhWfw/exec";

        // Tự động tải dữ liệu khi mở trang
        window.addEventListener('DOMContentLoaded', function() {
            if (localStorage.getItem("daDangNhap") !== "true") {
                alert("Vui lòng đăng nhập để xem hồ sơ!");
                window.location.href = "dangnhap.html";
                return;
            }

            document.getElementById('hoTenProfile').value = localStorage.getItem("tenDangNhap");
            document.getElementById('clbProfile').value = localStorage.getItem("clbDangNhap");
            
            const avatarLuu = localStorage.getItem("avatarDangNhap");
            document.getElementById('anhDaiDienHienThi').src = avatarLuu ? avatarLuu : "https://via.placeholder.com/100";
            document.getElementById('linkAnhMoi').value = avatarLuu;
        });

        // Hàm cập nhật hồ sơ cơ bản
        function capNhatThongTin() {
            const btn = event.target;
            const taiKhoan = localStorage.getItem("taiKhoanDangNhap");
            const avatarMoi = document.getElementById('linkAnhMoi').value.trim();
            const sdtMoi = document.getElementById('sdtProfile').value.trim();

            btn.innerText = "Đang cập nhật...";
            btn.disabled = true;

            const data = new URLSearchParams();
            data.append('action', 'capNhatHoSo');
            data.append('taiKhoan', taiKhoan);
            data.append('avatar', avatarMoi);
            data.append('soDienThoai', sdtMoi);

            fetch(API_LINK, { method: 'POST', body: data })
            .then(res => res.text())
            .then(ketQua => {
                if (ketQua === "ThanhCong") {
                    alert("Cập nhật hồ sơ thành công!");
                    localStorage.setItem("avatarDangNhap", avatarMoi);
                    document.getElementById('anhDaiDienHienThi').src = avatarMoi;
                } else {
                    alert("Có lỗi xảy ra: " + ketQua);
                }
            })
            .catch(err => alert("Lỗi kết nối mạng!"))
            .finally(() => {
                btn.innerText = "💾 Cập Nhật Hồ Sơ";
                btn.disabled = false;
            });
        }

        // Hàm xử lý đổi mật khẩu an toàn
        function xuLyDoiMatKhau() {
            const btn = event.target;
            const taiKhoan = localStorage.getItem("taiKhoanDangNhap");
            const mkCu = document.getElementById('mkCu').value;
            const mkMoi = document.getElementById('mkMoi').value;
            const mkXacNhan = document.getElementById('mkXacNhan').value;

            if (!mkCu || !mkMoi || !mkXacNhan) {
                alert("Vui lòng điền đầy đủ các trường mật khẩu!");
                return;
            }

            if (mkMoi !== mkXacNhan) {
                alert("Mật khẩu mới và xác nhận mật khẩu không khớp!");
                return;
            }

            btn.innerText = "Đang xử lý...";
            btn.disabled = true;

            const data = new URLSearchParams();
            data.append('action', 'doiMatKhau');
            data.append('taiKhoan', taiKhoan);
            data.append('matKhauCu', mkCu);
            data.append('matKhauMoi', mkMoi);

            fetch(API_LINK, { method: 'POST', body: data })
            .then(res => res.text())
            .then(ketQua => {
                if (ketQua === "ThanhCong") {
                    alert("Đổi mật khẩu thành công! Vui lòng đăng nhập lại.");
                    localStorage.clear();
                    window.location.href = "dangnhap.html";
                } else if (ketQua === "SaiMatKhauCu") {
                    alert("Mật khẩu cũ không chính xác!");
                } else {
                    alert("Có lỗi xảy ra: " + ketQua);
                }
            })
            .catch(err => alert("Lỗi kết nối mạng!"))
            .finally(() => {
                btn.innerText = "🔑 Đổi Mật Khẩu";
                btn.disabled = false;
                document.getElementById('mkCu').value = "";
                document.getElementById('mkMoi').value = "";
                document.getElementById('mkXacNhan').value = "";
            });
        }
    </script>
</body>
</html>
